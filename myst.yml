# JupyterBook 2 / MyST configuration
# Replaces _config.yml and _toc.yml (JupyterBook 1).
# Docs: https://next.jupyterbook.org

version: 1

project:
  title: Optimization for Decision Science
  authors:
    - name: Alexander Dowling
      email: adowling@nd.edu
  github: https://github.com/ndcbe/optimization

  # Notebooks are authored in notebooks/<N>-dev and published to notebooks/<N>
  # by scripts/process_notebooks.py. Only the published copies belong in the
  # site; excluding the sources also keeps them out of search.
  exclude:
    - .DS_Store
    - '**/.DS_Store'
    - '**/.ipynb_checkpoints'
    - '**/__pycache__'
    - notebooks/1-dev/**
    - notebooks/2-dev/**
    - notebooks/3-dev/**
    - notebooks/4-dev/**
    - notebooks/5-dev/**
    - notebooks/6-dev/**
    - notebooks/7-dev/**
    - notebooks/8-dev/**
    - notebooks/contrib-dev/**
    - _build/**
    - scripts/**
    - handouts/**

  toc:
    - file: intro.md

    - title: Organization
      children:
        - file: org/intro.md
          children:
            - file: org/syllabus.md
            - file: org/calendar.md
            - file: org/contribute.md
            - file: org/pyomo-style-guide.md
            - file: org/workshop.md
        - file: org/assignments.md
          children:
            - file: notebooks/assignments/Pyomo1.ipynb
            - file: notebooks/assignments/Pyomo2.ipynb
            - file: notebooks/assignments/Pyomo3.ipynb
            - file: org/project1.md
            - file: notebooks/assignments/Pyomo-Mini-Project.ipynb
            - file: notebooks/assignments/Algorithms1.ipynb
            - file: notebooks/assignments/Algorithms2.ipynb
            - file: notebooks/assignments/Algorithms3.ipynb
            - file: notebooks/assignments/Algorithms4.ipynb
            - file: notebooks/assignments/Algorithms5-SQP.ipynb
            - file: notebooks/assignments/Algorithms6-MINLP.ipynb
        - file: org/archive.md
          children:
            - file: org/project2.md
            - file: org/semester_project.md

    - title: Optimization Modeling in Pyomo
      children:
        - file: notebooks/1/getting-started.md
          children:
            - file: notebooks/1/Local-Install.ipynb
            - file: notebooks/1/Optimization-Modeling.ipynb
